name: Desktop Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows desktop app
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install -r desktop/requirements.txt

      - name: Run backend tests
        run: python -m pytest backend\tests -q

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Build desktop executable
        run: python -m PyInstaller --clean --noconfirm desktop/VideoNoteGenerator.spec

      - name: Package desktop app
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/VideoNoteGenerator/*" -DestinationPath "VideoNoteGenerator-windows-x64.zip" -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: VideoNoteGenerator-windows-x64
          path: VideoNoteGenerator-windows-x64.zip
          if-no-files-found: error

      - name: Publish versioned release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_RUN_NUMBER: ${{ github.run_number }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $releaseDate = Get-Date -Format "yyyy.MM.dd"
          $version = "$releaseDate.$env:RELEASE_RUN_NUMBER"
          if ($env:RELEASE_RUN_ATTEMPT -ne "1") {
            $version = "$version.$env:RELEASE_RUN_ATTEMPT"
          }

          $tag = "desktop-v$version"
          $zip = "VideoNoteGenerator-windows-x64.zip"
          $shortSha = $env:RELEASE_SHA.Substring(0, 7)
          $title = "Video Note Generator Desktop v$version"
          $notes = "Automated Windows desktop build for commit $shortSha."

          gh release create $tag $zip `
            --target $env:RELEASE_SHA `
            --title $title `
            --notes $notes `
            --latest
